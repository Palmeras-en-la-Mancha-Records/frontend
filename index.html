<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palmeras Records - Catálogo Físico Master</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="src/components/header_component.css">
    <link rel="stylesheet" href="src/components/sidebar_component.css">
    <link rel="stylesheet" href="views/styles/overview.css">
    <link rel="stylesheet" href="views/styles/catalog.css">
    <link rel="stylesheet" href="views/styles/modal.css">
    <link rel="stylesheet" href="views/styles/branches.css">
  </head>

  <body>

    
    <aside id="sidebar-container"></aside>

    
    <div class="main-wrapper">

      
      <header id="header-container"></header>

      
      <main class="content" id="main-view">
        
      </main>

    </div>

    <!-- Global Album Modal -->
    <dialog id="discModal" class="modal" aria-labelledby="modalTitle">
      <section class="modal-content modal-large">
        <button
          id="closeModal"
          class="close"
          type="button"
          aria-label="Cerrar ventana"
        >
          ×
        </button>

        <h2 id="modalTitle">Añadir disco</h2>

        <form id="discForm">
          <div class="modal-grid">
            <!-- Album Data -->
            <fieldset class="modal-col">
              <legend>Datos del disco</legend>

              <label for="title">Título</label>
              <input type="text" id="title" name="title" required>

              <label for="artist">Artista</label>
              <input type="text" id="artist" name="artist" required>

              <label for="release_year">Año de lanzamiento</label>
              <input type="number" id="release_year" name="release_year" required>

              <label for="genre">Género</label>
              <input type="text" id="genre" name="genre" required>

              <label for="label_id">Discográfica</label>
              <select id="label_id" name="label_id" required>
                <option value="">Selecciona una discográfica</option>
              </select>

              <label for="format_id">Formato</label>
              <select id="format_id" name="format_id" required>
                <option value="">Selecciona un formato</option>
              </select>

              <label for="price">Precio</label>
              <input type="number" id="price" name="price" step="0.01" min="0" required>

              <label for="stock">Stock</label>
              <input type="number" id="stock" name="stock" min="0" required>
            </fieldset>

            <fieldset class="modal-col">
              <legend>Portada del disco</legend>

              <div class="image-upload-box" id="imageUploadBox">
                <input
                  type="file"
                  id="cover_image_file"
                  name="cover_image_file"
                  accept="image/*"
                  aria-label="Seleccionar portada del disco"
                >
                <i class="material-symbols-rounded upload-icon" aria-hidden="true">add_photo_alternate</i>
                <p>Haz clic para seleccionar<br>la portada</p>
                <img id="coverPreview" src="src/img/dvd_placeholder.png" alt="Previsualización de la portada">
              </div>
            </fieldset>
          </div>

          <footer class="modal-footer">
            <button type="submit" class="btn-submit">Añadir disco</button>
          </footer>
        </form>
      </section>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="src/components/scripts/config.js"></script>
    <script src="src/components/scripts/modal_options.js"></script>
    <script src="src/components/scripts/image_uploader.js"></script>
    <script src="src/components/scripts/modal.js"></script>
    <script src="src/components/scripts/overview.js"></script>
    <script src="src/components/scripts/catalog.js"></script>
    <script src="src/components/scripts/router.js"></script>
    <script src="src/components/scripts/branches.js"></script>
    <script src="script.js"></script>
  </body>
</html>
