<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palmeras Records - Catálogo Físico Master</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="src/components/header_component.css">
    <link rel="stylesheet" href="src/components/sidebar_component.css">
    <link rel="stylesheet" href="src/views/styles/overview.css">
    <link rel="stylesheet" href="src/views/styles/modal.css">
    <link rel="stylesheet" href="src/views/styles/catalogue.css">
    <link rel="stylesheet" href="src/views/styles/albums.css">
    <link rel="stylesheet" href="src/views/styles/branches.css">
</head>

<body>
    <!-- Sidebar Component -->
    <div id="sidebar-container"></div>

    <!-- Layout Wrapper -->
    <div class="main-wrapper">
        <!-- Header Component -->
        <div id="header-container"></div>

        <!-- Main Content -->
        <main class="content" id="main-view">
        <!-- Contenido dinámico inyectado aquí -->
        </main>
    </div>

    <!-- Album modal: lives here so albums.js can bind it at load time -->
    <div id="discModal" class="modal">
        <div class="modal-content modal-large">
            <button id="closeModal" class="close">×</button>

            <h2 id="album-modal-title">Añadir disco</h2>

            <form id="discForm">
                <div class="modal-grid">
                    <!-- Left Column: Data -->
                    <div class="modal-col">
                        <label for="title">Título</label>
                        <input type="text" id="title" required>

                        <label for="artist">Artista</label>
                        <input type="text" id="artist" required>

                        <label for="release_year">Año</label>
                        <input type="number" id="release_year" min="1900" max="2100">

                        <label for="genre">Género</label>
                        <input type="text" id="genre">

                        <label for="record_label">Discográfica</label>
                        <input type="text" id="record_label">

                        <label for="price">Precio</label>
                        <input type="number" id="price" step="0.01" min="0">

                        <label for="stock">Stock</label>
                        <input type="number" id="stock" min="0">
                    </div>

                    <!-- Right Column: Image -->
                    <div class="modal-col">
                        <label>Portada del Disco</label>
                        <div class="image-upload-box" id="imageUploadBox">
                            <input type="file" id="cover_image_file" accept="image/*">
                            <i class="material-symbols-rounded upload-icon">add_photo_alternate</i>
                            <p>Haz clic para cambiar<br>la imagen</p>
                            <img id="coverPreview" src="src/img/dvd_placeholder.png" alt="Previsualización">
                        </div>

                        <label for="cover_image_url" style="margin-top: 16px;">O URL de la imagen</label>
                        <input type="url" id="cover_image_url" placeholder="https://...">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn-submit">Guardar disco</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="src/js/albums.js"></script>
    <script src="script.js"></script>
  </body>
</html>
