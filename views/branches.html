<div class="page-header">
    <div>
        <div class="breadcrumbs">
            <span class="bc-link">Red Comercial</span>
            <span class="bc-separator">/</span>
            <span class="bc-current">Sucursales</span>
        </div>
        <h1 class="page-title">Sucursales</h1>
        <p class="page-desc">Gestión de las tiendas y puntos de venta de Palmeras Records.</p>
    </div>
    <div class="header-actions">
        <button class="btn btn-outline">
            <div class="dot-yellow"></div>
            <span id="branches-count">0</span>&nbsp;Sucursales
        </button>
        <button class="btn btn-yellow" id="branches-new-btn">
            <i class="material-symbols-rounded">add_circle</i>
            Nueva Sucursal
        </button>
    </div>
</div>

<!-- List Header -->
<div class="grid-header">
    <div class="grid-title-group">
        <h2 class="grid-title">Listado de Sucursales</h2>
        <span class="badge-dark"><span id="branches-badge">0</span> sucursales activas</span>
    </div>
</div>

<!-- branches.js will render the stores returned by the API here -->
<div class="branches-grid" id="branches-grid">
    <!-- Dynamic content -->
</div>

<div class="empty-state" id="branches-empty">
    <i class="material-symbols-rounded empty-state-icon">storefront</i>
    <h3 class="empty-state-title">No hay sucursales</h3>
    <p class="empty-state-desc">Todavía no hay sucursales para mostrar.</p>
</div>

<!-- Pop-up window: create / edit -->
<div class="branch-modal" id="branch-modal">
    <div class="branch-modal-box">
        <h2 class="branch-modal-title" id="branch-modal-title">Nueva sucursal</h2>

        <form id="branch-form" class="branch-form">
            <input type="hidden" id="branch-input-id">

            <div class="filter-group">
                <label class="filter-label" for="branch-input-name">
                    <i class="material-symbols-rounded">storefront</i> Nombre
                </label>
                <input type="text" id="branch-input-name" class="filter-input" required>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="branch-input-address">
                    <i class="material-symbols-rounded">location_on</i> Dirección
                </label>
                <input type="text" id="branch-input-address" class="filter-input" required>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="branch-input-phone">
                    <i class="material-symbols-rounded">call</i> Teléfono
                </label>
                <input type="text" id="branch-input-phone" class="filter-input" required>
            </div>

            <div class="branch-form-actions">
                <button type="button" class="btn btn-outline" id="branch-cancel-btn">Cancelar</button>
                <button type="submit" class="btn btn-yellow" id="branch-save-btn">
                    <i class="material-symbols-rounded">save</i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
