<main>    
    <!-- Records, ready for Back-end -->
    <div class="cards-grid" id="catalog-grid">

        <!-- Album card -->
        <div class="card">
            <div class="album-container">
                <img src="album-cover.jpg" alt="Album Cover">
                <span class="badge">Categoría</span>
                <span class="badge">Género</span>
            </div>
            <div class="card-content">
                <h4>Nombre del Álbum</h4>
                <p class="artist">Nombre del Artista</p>
                <p class="price">€19.99</p>
            </div>
            <button class="btn btn-outline">Editar</button>
            <button class="btn btn-danger">Eliminar</button>
        </div>
        
        <!-- Additional album cards can be added here -->
    </div>
</main>
